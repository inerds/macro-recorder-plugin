name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # ENGINE_REV gate: a pull request that touches sandbox/ or engine/ must
      # also bump ENGINE_REV in the same range, or Creator's cached plugin.js
      # goes stale and reproduces bugs that are already fixed. Skipped on a
      # plain push: a push to main has no base ref to diff against.
      #
      # The `...` range needs the merge base between HEAD and the base branch,
      # so checkout above is `fetch-depth: 0` (full history) rather than the
      # single-commit checkout GitHub gives by default — a shallow HEAD has no
      # ancestry to find a merge base in. The fetch below is then just to give
      # `origin/<base_ref>` a name to diff against; `--depth=1` costs nothing
      # extra here because the objects it would fetch already exist locally.
      - if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          node scripts/engine-rev-gate.mjs --range "origin/${{ github.base_ref }}...HEAD"

      # Pinned to the packageManager version in package.json so CI never
      # drifts from what contributors run locally.
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm lint:docs
      - run: pnpm test:quickjs
      - run: pnpm build

      # The tree is prettier-clean under prettier.config.mjs; format:check
      # above keeps it that way.

  # The browser checks the node-only unit tests cannot make: what paints on
  # top, what a box measures, what a modifier does to a key — and the full
  # record-to-playback round trip against the real sandbox bundle. A separate
  # job so a browser failure is legible on its own, and so its screenshots
  # upload whatever the result. See scripts/ui-probe/README.md.
  ui-probe:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Chrome is preinstalled on GitHub's ubuntu runners as
      # `google-chrome-stable`, which is one of the names the driver looks
      # for; set CHROME to point it somewhere else.
      - run: pnpm test:ui

      # The other half: the real sandbox bundle against the real panel, with
      # the shared fake scene as the host. It is the only check that runs
      # record and playback together.
      - run: pnpm test:harness

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-probe-screenshots
          path: artifacts/ui
          if-no-files-found: warn

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: host-harness-screenshots
          path: artifacts/harness
          if-no-files-found: warn
